# 信息源清单 —— sources-crawler 维护，格式见 contest-radar/SPEC.md 第 6 节。
# parser 字段为 importlib 可导入的 "模块.类名"；params 会原样传给 BaseSource.__init__。
sources:
  # ---------- 启用源（4 个，已实测） ----------
  - id: ccf_csp
    name: CCF CSP认证
    method: http
    parser: app.parsers.cspro.CsproSource
    enabled: true
    params:
      url: "https://www.cspro.org/cms/show.action?code=publish_8ac21fad9d27f22a019f5944f2eb00e1&siteid=100000"
      channel_id: "0000000103" # 通知公告栏目
  - id: nowcoder
    name: 牛客竞赛
    method: http
    parser: app.parsers.nowcoder.NowcoderSource
    enabled: true
    params:
      url: "https://ac.nowcoder.com/acm/home"
  - id: codeforces
    name: Codeforces
    method: api
    parser: app.parsers.codeforces.CodeforcesSource
    enabled: true
    params:
      url: "https://codeforces.com/api/contest.list"
  - id: huawei
    name: 华为云大赛
    method: playwright
    parser: app.parsers.huawei.HuaweiSource
    enabled: true
    params:
      url: "https://competition.huaweicloud.com/"
  # ---------- 候选源（默认停用，enabled=false） ----------
  - id: ccf_ccsp
    name: CCF CCSP竞赛
    method: http
    parser: app.parsers.ccsp.CcspSource
    enabled: true
    params:
      url: "https://www.ccf.org.cn/ccsp/"
  - id: ccf_cacc
    name: CCF算法能力大赛
    method: playwright
    parser: app.parsers.cacc.CaccSource
    enabled: true
    params:
      url: "https://cacc.ccf.org.cn/"
      # 该站为 Vue SPA，2026-10 已升级为 Playwright 渲染方案。
  - id: ccf_cert
    name: CCF认证
    method: http
    parser: app.parsers.ccf_cert.CcfCertSource
    enabled: true
    params:
      url: "https://www.ccf.org.cn/Activities/Certification/"
  # ---------- P1 冲刺1 第一批新增（5 个，2026-10 实测） ----------
  - id: tiaozhanbei
    name: 挑战杯
    method: http
    parser: app.parsers.tiaozhanbei.TiaozhanbeiSource
    enabled: true
    params:
      url: "https://www.tiaozhanbei.net/"
  - id: cy_ncss
    name: 中国国际大学生创新大赛
    method: http
    parser: app.parsers.cy_ncss.CyNcssSource
    enabled: true
    params:
      url: "https://cy.ncss.cn/"
  - id: jsjds
    name: 中国大学生计算机设计大赛
    method: http
    parser: app.parsers.jsjds.JsjdsSource
    enabled: true
    params:
      url: "https://jsjds.blcu.edu.cn/"
  - id: leetcode
    name: LeetCode周赛
    method: http
    parser: app.parsers.leetcode.LeetcodeSource
    enabled: true
    params:
      url: "https://leetcode.cn/graphql/"
      # 数据接口为官方 GraphQL（POST contestV2UpcomingContests），列表页本身是客户端渲染
  - id: tianchi
    name: 阿里天池
    method: http
    parser: app.parsers.tianchi.TianchiSource
    enabled: true
    params:
      url: "https://tianchi.aliyun.com/v3/proxy/competition/api/race/page"
      pages: 2 # 列表接口公开 JSON，抓前 2 页
  # ---------- P1 冲刺1 第二批新增（3 个 Playwright，2026-10 实测） ----------
  - id: lanqiao
    name: 蓝桥杯大赛
    method: playwright
    parser: app.parsers.lanqiao.LanqiaoSource
    enabled: true
    params:
      url: "https://dasai.lanqiao.cn/"
  - id: zhihu_hackathon
    name: 知乎黑客松
    method: playwright
    parser: app.parsers.zhihu_hackathon.ZhihuHackathonSource
    enabled: true
    params:
      url: "https://www.zhihu.com/hackathon"
  - id: astar
    name: 百度之星
    method: playwright
    parser: app.parsers.astar.AstarSource
    enabled: true
    params:
      url: "https://astar.baidu.com/#/"
